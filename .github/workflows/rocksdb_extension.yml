name: rocksdb_extension

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux-x86:
    name: ${{ matrix.compiler }}
    runs-on:
      labels: 32-core-ubuntu
    container:
      image: ${{ matrix.container_image }}
    timeout-minutes: 120
    env:
      # Older devvm-built images contain a loopback proxy that is unreachable
      # from GitHub-hosted job containers.
      http_proxy: ""
      https_proxy: ""
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Preserve restored FetchContent sources and skip update checks for the
      # commit-specific source cache.
      CLEAN_BUILD_DIRECTORY: OFF
      FETCHCONTENT_UPDATES_DISCONNECTED: ON
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            container_image: ghcr.io/facebook/rocksdb-extensions_ubuntu:24.0
          - compiler: clang
            cc: clang
            cxx: clang++
            container_image: ghcr.io/facebook/rocksdb-extensions_ubuntu:24.0

    steps:
      - uses: actions/checkout@v4

      - name: Resolve dependency revisions
        id: revisions
        run: ./scripts/build-latest-releases.sh --locked --resolve-only >> "${GITHUB_OUTPUT}"

      - name: Restore dependency caches
        uses: ./.github/actions/setup-dependency-cache
        with:
          compiler: ${{ matrix.compiler }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          container-image: ${{ matrix.container_image }}
          rocksdb-revision: ${{ steps.revisions.outputs.rocksdb_revision }}
          nimble-revision: ${{ steps.revisions.outputs.nimble_revision }}

      - name: Build and test
        env:
          ROCKSDB_REVISION: ${{ steps.revisions.outputs.rocksdb_revision }}
          NIMBLE_REVISION: ${{ steps.revisions.outputs.nimble_revision }}
        run: ./scripts/build-latest-releases.sh

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats -v || true
